name: Build release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a GitHub draft release (run from an existing version tag)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: Test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync pytest

  build:
    name: Build and install · ${{ matrix.os }}
    needs: tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # Builds the wheel from the sdist, checks native tagging/contents, then
      # installs outside the checkout and runs offline help/doctor smoke tests.
      - run: uv run --no-sync python scripts/build_release.py --output dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          # Both hosts rebuild from source; publish one source archive so
          # platform line-ending differences cannot create conflicting assets.
          path: |
            dist/release/*.whl
            ${{ runner.os == 'macOS' && 'dist/release/*.tar.gz' || '' }}
          if-no-files-found: error

  draft-release:
    name: Prepare GitHub draft release
    needs: [tests, build]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      inputs.create_draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require an existing version tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['RELEASE_REF'] != f'refs/tags/v{version}':
              raise SystemExit('Draft releases must run from the existing v' + version + ' tag.')
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
      - name: Collect matching artifacts and compute checksums
        run: |
          python3 - <<'PY'
          import hashlib, shutil
          from pathlib import Path
          source = Path('release-assets')
          files = sorted(path for path in source.rglob('*') if path.name.endswith(('.whl', '.tar.gz')))
          output = source / 'combined'
          output.mkdir()
          for path in files:
              target = output / path.name
              if target.exists() and target.read_bytes() != path.read_bytes():
                  raise SystemExit('Build hosts produced conflicting artifacts: ' + path.name)
              shutil.copy2(path, target)
          artifacts = sorted(output.iterdir())
          if len(artifacts) != 3:
              raise SystemExit('Expected a macOS wheel, portable wheel, and source archive.')
          (output / 'SHA256SUMS.txt').write_text(''.join(
              hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n'
              for path in artifacts
          ))
          PY
      - name: Create draft with tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf 'Installable macOS Apple Silicon and Windows wheels, plus a source archive.\n\nThe macOS wheel includes the Apple Vision helper. FFmpeg is installed separately; speech models download on first use.\n\nBuilt and tested from commit %s. Verify assets with SHA256SUMS.txt.\n' "$GITHUB_SHA" > release-notes.txt
          gh release create "$RELEASE_TAG" release-assets/combined/* --verify-tag --draft --title "YouTubeText $RELEASE_TAG" --notes-file release-notes.txt
