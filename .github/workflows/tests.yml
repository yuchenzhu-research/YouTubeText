name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.os }} · Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Windows venv/pip fallback smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:YOUTUBETEXT_FALLBACK_TEST_PYTHON = (uv python find 3.12).Trim()
          $env:YOUTUBETEXT_FALLBACK_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'YouTubeText pip fallback with spaces'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/windows_install_fallback.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Exercise the Windows PowerShell 5.1 installer without downloading media
      # or models. The fake FFmpeg is deliberately unusable: doctor must reject it.
      - name: Windows installer smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:YOUTUBETEXT_PYTHON = (uv python find 3.12).Trim()
          $fixture = Join-Path $env:RUNNER_TEMP 'YouTubeText CI FFmpeg'
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          Set-Content -Path (Join-Path $fixture 'ffmpeg.cmd') -Value '@echo off' -Encoding Ascii
          $env:PATH = "$fixture;$env:PATH"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\youtubetext.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $doctorJson = & .\.venv\Scripts\youtubetext.exe doctor --json
          if ($LASTEXITCODE -ne 1) { throw 'Doctor accepted an unusable FFmpeg fixture.' }
          $doctor = $doctorJson | ConvertFrom-Json
          $ffmpegCheck = @($doctor.checks | Where-Object { $_.key -eq 'ffmpeg' })
          if ($doctor.ready -or $ffmpegCheck.Count -ne 1 -or $ffmpegCheck[0].ok) {
            throw 'Doctor must report the FFmpeg fixture as unavailable.'
          }

      - name: Install locked development dependencies
        run: uv sync --locked

      - name: Import core modules
        run: uv run --no-sync python -c "import youtubetext.cli, youtubetext.acquisition, youtubetext.resume"

      - name: Isolate process-interruption test
        if: runner.os == 'macOS'
        run: uv run --no-sync pytest tests/test_supervisor.py::test_interrupt_terminates_the_worker_process_group -vv

      - name: Run unit tests
        run: uv run --no-sync pytest
