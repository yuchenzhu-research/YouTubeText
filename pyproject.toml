[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "youtubetext"
version = "0.2.0"
description = "A macOS and Windows terminal tool for clean YouTube and Bilibili transcripts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11,<3.15"
dependencies = [
  "click>=8.1,<9",
  "platformdirs>=4.3,<5",
  "rich>=13.9,<15",
  "yt-dlp>=2026.3.17",
  "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "rapidocr>=3.9,<4; sys_platform == 'win32'",
  "onnxruntime>=1.23,<2; sys_platform == 'win32'",
  "faster-whisper>=1.2,<2; sys_platform == 'win32'",
]

[project.scripts]
youtubetext = "youtubetext.cli:entrypoint"

[project.urls]
Repository = "https://github.com/yuchenzhu-research/YouTubeText"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/youtubetext"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/native/macos/VisionOCR.swift",
  "/scripts",
  "/hatch_build.py",
  "/pyproject.toml",
  "/uv.lock",
  "/README.md",
  "/CHANGELOG.md",
  "/docs",
  "/tests/fixtures/ted_caption_timing.json",
  "/THIRD_PARTY_NOTICES.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
